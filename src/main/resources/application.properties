# DB credentials come from environment variables (nothing secret is committed).
# Locally, defaults point at a Postgres on localhost.
# On Render, set DB_URL, DB_USERNAME, DB_PASSWORD in the service's Environment tab.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/staffrating}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Creates/updates the table automatically (fine for iteration 1)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Render tells the app which port to use
server.port=${PORT:8080}
